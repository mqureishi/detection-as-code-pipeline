title: Potential LSASS Credential Dumping via Mimikatz
id: f8e7d6c5-4321-8765-abcd-ef0123456789
status: experimental
description: Detects memory access or process injection against LSASS associated with credential dumping.
author: Mohammed Hasan Qureishi
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
  condition: selection
falsepositives:
  - Legitimate security auditing or debugging tools.
level: high
